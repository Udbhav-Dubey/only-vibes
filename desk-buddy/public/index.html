<title>buddy</title>
<style>
  :root { --bg:#000; --eye:#ece8df; --pupil:#0a0a0a; --fg:#ece8df; --dim:#6d6a63; }
  * { box-sizing: border-box; }
  html { touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }
  body { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2vh; padding:2vh 4vw; }
  .brow { stroke:var(--eye); stroke-width:12; stroke-linecap:round; }
  .sc { fill:var(--eye); } .p { fill:var(--pupil); } .lt, .lb { fill:var(--bg); }
  svg { width:min(92vw, 150vh); height:auto; max-height:62vh; }
  #info { text-align:center; min-height:22vh; width:100%; }
  #title { font-size:clamp(18px,4.5vh,40px); }
  #sub { font-size:clamp(14px,3vh,26px); color:var(--dim); margin-top:.6em; }
  #bee { position:fixed; left:0; top:0; width:7vh; height:4.7vh; pointer-events:none; z-index:6; will-change:transform; }
  #bee .wing { transform-origin:33px 14px; animation:beeflap .09s linear infinite alternate; }
  @keyframes beeflap { from { transform:scaleY(1); } to { transform:scaleY(.3); } }
  #z { position:fixed; right:12vw; top:8vh; font-size:5vh; color:var(--dim); opacity:0; }
  #z.on { animation: zz 2.4s ease-in-out infinite; }
  #status { position:fixed; left:4vw; bottom:3vh; color:var(--dim); font-size:clamp(10px,1.6vh,15px); }
  #lyric { min-height:1.5em; color:var(--fg); opacity:.92; font-size:clamp(22px,5.2vh,54px); line-height:1.25; margin-top:.45em; max-width:92vw; text-wrap:balance; transition:opacity .25s, transform .25s; }
  #lyric:empty { display:none; }
  /* idle/coding + music: big lyrics, track name on top */
  body.music-view #title { font-size:clamp(14px,2.5vh,24px); color:var(--dim); }
  body.music-view #sub { display:none; }
  body.music-view #lyric { font-size:clamp(28px,6.4vh,68px); opacity:1; margin-top:.25em; }
  body.music-view #info { min-height:24vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  /* dsa/pomo + music: the timer/problem stays, lyrics sit under it, smaller */
  body.music-compact #lyric { font-size:clamp(16px,3.4vh,34px); color:var(--dim); opacity:1; margin-top:.5em; }
  #mouth { fill:none; stroke:var(--eye); stroke-width:7; stroke-linecap:round; opacity:0; transition:all .2s; }
  #face.sway { transform-origin:50% 50%; animation:sway 2.8s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(-1deg) translateY(0)} 50%{transform:rotate(1deg) translateY(5px)} }
  @keyframes zz { 0%{opacity:0;transform:translate(0,10px)} 30%{opacity:.9} 100%{opacity:0;transform:translate(14px,-30px)} }
  @media (prefers-reduced-motion: reduce) { #z.on { animation:none; opacity:.7; } }
</style>

</svg></div>
<div id="info"><div id="title"></div><div id="sub"></div><div id="lyric"></div></div><div id="status">energy 100 · attention 50</div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let st = { mode:'idle', text:'', since:Date.now() }, idleMs = 0, flash = null, lyric = '', lyricAt = 0;
let energy=100, attention=50, failureStreak=0, lastActivity=Date.now(), typingTimes=[], micro={next:performance.now()+5000,until:0,type:''}, pokeTimes=[];
let audio={bass:0,mid:0,treble:0,beat:0,stamp:0,beatAt:-1e9}, lyricGlanceUntil=0, lyricSide=1;
let poke={n:0,last:0,until:0,lv:null}, say=null, actx=null, kps=0, typingOn=false, notifyUntil=0;
let tgt = {x:0,y:0}, g = {x:0,y:0}, lid = 0, bot = 0, startle = 0, wasIdle = 0;
let wander = {x:0,y:0,next:0}, blinkAt = performance.now()+3000, blinkStart = -1e9, roll = {until:0,next:20000};
const ex = {tilt:0, brow:0, bt:0};
let music = {on:false, name:'', line:'', status:''}, lineTimes = [], groove = {period:1400, lastLine:-1e9};
// each lyric line = one beat of "groove": the brows pop on it, and the nod speed follows how fast lines come
function noteLine(now) {
  groove.lastLine = now; lineTimes.push(now); if (lineTimes.length > 5) lineTimes.shift();
  if (lineTimes.length >= 3) groove.period = clamp((lineTimes[lineTimes.length-1] - lineTimes[0]) / (lineTimes.length-1) / 2, 600, 2200);
}
function grooveLift(now, lv) {
  if (!music.on || !(lv==='vibe' || lv==='hype' || lv==='chill')) return 0;
  const amp = lv==='hype' ? 1.5 : lv==='chill' ? .45 : 1;
  const nod = (Math.sin(now / groove.period * Math.PI * 2) * .5 + .5) * 5;       // steady head-nod
  const hit = Math.max(0, 1 - (now - groove.lastLine) / 450) * 9;                 // pop on each new lyric line
  const fresh = now - audio.stamp < 700;                                          // live audio from the server?
  const pop = fresh ? Math.max(0, 1 - (now - audio.beatAt) / 280) * 11 : 0;      // brows pop on each real beat
  const live = fresh ? audio.bass * 4 : 0;
  return amp * (nod * (fresh ? .25 : 1) + hit + pop) + live;
}   // lid tilt, brow lift, brow tilt (smoothed)
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
// fallback: input seen by this page itself (works on localhost even if the server can't read the cursor)
let localLast = Date.now();
const idleNow = () => Math.min(idleMs, Date.now() - localLast);
addEventListener('mousemove', e => { localLast = Date.now(); tgt = { x: clamp((e.clientX/innerWidth-.5)*2,-1,1), y: clamp((e.clientY/innerHeight-.5)*2-.25,-1,1) }; });
addEventListener('keydown', () => { localLast = Date.now(); lastActivity=Date.now(); energy=clamp(energy+2,0,100); attention=clamp(attention+8,0,100); typingTimes.push(Date.now()); typingTimes=typingTimes.filter(t=>Date.now()-t<3000); });
addEventListener('touchstart', e=>{localLast=Date.now();lastActivity=Date.now();energy=clamp(energy+4,0,100);pokeTimes.push(Date.now());pokeTimes=pokeTimes.filter(t=>Date.now()-t<5000);if(pokeTimes.length>4) flash={mood:'annoyed',until:performance.now()+1800}; const t=e.touches[0]; tgt={x:clamp((t.clientX/innerWidth-.5)*2,-1,1),y:clamp((t.clientY/innerHeight-.5)*2-.25,-1,1)};},{passive:true});
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){lastActivity=Date.now();energy=clamp(energy+1,0,100);}});
// tap anywhere once to go fullscreen (browsers require a user gesture)
addEventListener('click', () => {
  const r = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement)
    (r.requestFullscreen || r.webkitRequestFullscreen)?.call(r);
});

// Friendly poke ladder: startled, annoyed, angry, then temporarily ignores spam.
const POKE_LINES=[null,null,'hey','...','stop.','stop.','i said stop.','last warning'];
addEventListener('pointerdown', e => {
  const now=performance.now(); localLast=Date.now();
  tgt={x:clamp((e.clientX/innerWidth-.5)*2,-1,1),y:clamp((e.clientY/innerHeight-.5)*2-.25,-1,1)};
  startle=Math.max(startle,.8);
  poke.n=now-poke.last<4000?poke.n+1:1; poke.last=now;
  const n=poke.n, hold=n<4?2500:4500;
  poke.lv=n===1?null:n<4?'annoyed':n<8?'angry':'ignore'; poke.until=now+hold;
  const line=n>=8?'not talking to you':POKE_LINES[n];
  say=line?{text:line,until:Date.now()+hold}:null;
  render();
});
// Browsers only allow audio after a user gesture.
addEventListener('click',()=>{try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(_){}});
function beep(high){if(!actx)return;const o=actx.createOscillator(),a=actx.createGain(),t=actx.currentTime;o.frequency.value=high?880:520;o.connect(a);a.connect(actx.destination);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(.12,t+.03);a.gain.exponentialRampToValueAtTime(.0001,t+.45);o.start(t);o.stop(t+.5);}

// ---- keep the phone screen on ----
// Wake Lock API needs https/localhost; over plain http://192.168... it doesn't exist, so fall back to
// looping a tiny silent video (the NoSleep.js trick). Both need one tap on the page first.
const NOSLEEP = { webm:'data:video/webm;base64,GkXfo59ChoEBQveBAULygQRC84EIQoKEd2VibUKHgQJChYECGFOAZwEAAAAAAAHpEU2bdLpNu4tTq4QVSalmU6yBoU27i1OrhBZUrmtTrIHYTbuMU6uEElTDZ1OsggEeTbuMU6uEHFO7a1OsggHT7AEAAAAAAABZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAVSalmsirXsYMPQkBNgI1MYXZmNjAuMTYuMTAwV0GNTGF2ZjYwLjE2LjEwMESJiECPQAAAAAAAFlSua8GuAQAAAAAAADjXgQFzxYgexytKhIIfDZyBACK1nIN1bmSIgQCGhVZfVlA4g4EBI+ODhDuaygDgibCBQLqBQJqBAhJUw2f8c3OgY8CAZ8iaRaOHRU5DT0RFUkSHjUxhdmY2MC4xNi4xMDBzc9ZjwItjxYgexytKhIIfDWfIoUWjh0VOQ09ERVJEh5RMYXZjNjAuMzEuMTAyIGxpYnZweGfIoUWjiERVUkFUSU9ORIeTMDA6MDA6MDEuMDAwMDAwMDAwAB9DtnWv54EAo6qBAACA8AIAnQEqQABAAABHCIWFiJmEiAKCAAZwPEJgCrIg9zAA/v+PvAAcU7trkbuPs4EAt4r3gQHxggGf8IED', mp4:'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMQbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAjp0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAEAAAABAAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAGybWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAQABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABXW1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAR1zdGJsAAAAuXN0c2QAAAAAAAAAAQAAAKlhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAEAAQABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAL2F2Y0MBQsAK/+EAF2dCwArZBCbARAAAAwAEAAADAAg8SJkgAQAFaMuDyyAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAUkAAAFJAAAAAYc3R0cwAAAAAAAAABAAAAAQAAQAAAAAAcc3RzYwAAAAAAAAABAAAAAQAAAAEAAAABAAAAFHN0c3oAAAAAAAACkgAAAAEAAAAUc3RjbwAAAAAAAAABAAADQAAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAAKabWRhdAAAAnAGBf//bNxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTEgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD00MCByYz1jcmYgbWJ0cmVlPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAIAAAAAaZYiEBX///w9FAAFC3ycnJ1111111111114A=' };
let wakeSentinel = null, nosleepVideo = null, awakeState = 'tap once to keep screen on';
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      if (!wakeSentinel) { wakeSentinel = await navigator.wakeLock.request('screen'); wakeSentinel.addEventListener('release', () => { wakeSentinel = null; awakeState = 'tap once to keep screen on'; }); }
      awakeState = 'screen kept on'; return;
    }
  } catch (_) {}
  try {
    if (!nosleepVideo) {
      nosleepVideo = document.createElement('video');
      nosleepVideo.setAttribute('playsinline', ''); nosleepVideo.muted = true; nosleepVideo.loop = true;
      nosleepVideo.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none';
      nosleepVideo.src = nosleepVideo.canPlayType('video/webm') ? NOSLEEP.webm : NOSLEEP.mp4;
      document.body.appendChild(nosleepVideo);
    }
    await nosleepVideo.play(); awakeState = 'screen kept on (video)';
  } catch (_) { awakeState = 'tap once to keep screen on'; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
addEventListener('click', keepAwake); addEventListener('touchend', keepAwake);
keepAwake();

// ---- events ----
const es = new EventSource('/events' + location.search);   // ?t=password when opened from the phone
es.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.type === 'state') { const prev=st; st=e.state; st.recv=Date.now(); if(prev.mode==='pomo'&&st.mode==='pomo'&&prev.phase!==st.phase) beep(st.phase!=='focus'); render(); }
  else if (e.type === 'mouse') { tgt = { x: clamp((e.x-.5)*2,-1,1), y: clamp((e.y-.5)*2-.25,-1,1) }; }
  else if (e.type === 'idle') idleMs = e.ms;
  else if (e.type === 'music') { const was = music.on; music = e; lyric = e.line || ''; if (!e.on || !was) lineTimes = []; render(); }
  else if (e.type === 'lyric') { lyric = e.line; music.line = e.line; lyricAt = Date.now(); lyricGlanceUntil=performance.now()+850; lyricSide=-lyricSide; if (e.line) noteLine(performance.now()); render(); }
  else if (e.type === 'audio_level') { audio.bass=clamp(Number(e.bass)||0,0,1); audio.mid=clamp(Number(e.mid)||0,0,1); audio.treble=clamp(Number(e.treble)||0,0,1); audio.beat=clamp(Number(e.beat)||0,0,1); if(audio.beat>.5) audio.beatAt=performance.now(); audio.stamp=performance.now(); }
  else if (e.type === 'flash') { flash = { mood:e.mood, until: performance.now() + (e.ms || (e.mood==='panic'?3500:2500)) };
    if (e.text) { say = { text:e.text, until: Date.now() + (e.ms || 2500) }; render(); } }
  else if (e.type === 'typing') { kps = Number(e.kps) || 0; typingOn = !!e.on; }
  else if (e.type === 'notify') { notifyUntil = performance.now() + 1300; startle = Math.max(startle, .5); }
};

// ---- text area ----
const fmt = s => { s = Math.floor(s); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
function render() {
  const ambient = st.mode === 'idle';      // only idle gets the big lyrics; coding/dsa/pomo keep their text
  document.body.classList.toggle('music-view', music.on && ambient);
  document.body.classList.toggle('music-compact', music.on && !ambient);
  const el = (Date.now() - st.since) / 1000, T = $('#title'), S = $('#sub');
  if (st.mode === 'dsa') {
    T.textContent = st.text || 'what are we solving today?';
    S.textContent = el > 1500 ? `${fmt(el)}  stuck? write the brute force first` : fmt(el);
  } else if (st.mode === 'coding') {
    T.textContent = 'nvim'; S.textContent = `in the editor for ${fmt(el)}`;
  } else if (st.mode === 'pomo') {
    const left=Math.max(0,st.left-(Date.now()-(st.recv||Date.now())));
    T.textContent=fmt(Math.ceil(left/1000));
    S.textContent=`${st.phase==='focus'?'focus':st.phase==='long'?'long break':'break'}   ${'●'.repeat(st.done||0)}${'○'.repeat(4-(st.done||0))}`;
  } else {
    const d = new Date(); T.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    S.textContent = '';
  }
  if (music.on && ambient) { T.textContent = music.name || '♪ music'; S.textContent = ''; }
  const lyricEl = $('#lyric');
  lyricEl.textContent = music.on ? (lyric || (music.status === 'instrumental' ? '♪ instrumental ♪' : '')) : '';
  lyricEl.style.opacity = lyric ? '1' : '.65';
  lyricEl.style.transform = lyric ? 'translateY(0)' : 'translateY(3px)';
  if(say && Date.now()<say.until) { S.textContent=say.text; if (music.on && ambient) T.textContent=say.text; }
}
setInterval(render, 1000); render();

// ---- eyes ----
// ---- music mood: hype on loud/bass-heavy parts, chill on quiet ones, overjoyed flash on a sudden drop ----
const mus = {quick:0, fast:0, slow:0, t:0, warm:0, lvl:'vibe', dropCool:0};
function musicMood(now) {
  const dt = Math.min(.25, Math.max(0, (now - mus.t)/1000)); mus.t = now;
  if (now - audio.stamp > 700) { mus.warm = 0; mus.quick = mus.fast = mus.slow = 0; return mus.lvl = 'vibe'; }  // no live audio
  const x = audio.bass*.55 + audio.mid*.3 + audio.treble*.15, a = tau => 1 - Math.exp(-dt/tau);
  mus.quick += (x-mus.quick)*a(.25); mus.fast += (x-mus.fast)*a(1.5); mus.slow += (x-mus.slow)*a(8);
  mus.warm += dt;
  if (mus.warm < 4) mus.slow = mus.fast;                                            // baseline = how this song starts out
  if (mus.warm < 4 || mus.slow < .05) return mus.lvl = 'vibe';                    // still learning this song / silence
  if (mus.quick - mus.fast > .28 && now > mus.dropCool) {                          // sudden drop
    mus.dropCool = now + 9000; flash = {mood:'overjoyed', until: now + 1100}; return 'overjoyed';
  }
  if (mus.lvl === 'hype')       { if (mus.fast < mus.slow*1.08 + .02) mus.lvl = 'vibe'; }
  else if (mus.lvl === 'chill') { if (mus.fast > mus.slow*.85) mus.lvl = 'vibe'; }
  else if (mus.fast > mus.slow*1.2 + .04) mus.lvl = 'hype';
  else if (mus.fast < mus.slow*.7 - .02) mus.lvl = 'chill';
  return mus.lvl;
}
function level(now) {
  // Lyrics view stays calm and takes priority over pokes, idle moods and flashes.
  if(poke.lv && now<poke.until) return poke.lv;
  if(poke.lv && now>=poke.until) poke.lv=null;
  // Lyrics view is a calm listening mode: don't let idle moods or external
  // panic/worry flashes take over the face while the lyric is the focus.
  if (flash && now < flash.until) return flash.mood;
  flash = null;
  if (st.mode === 'dsa' && Date.now() - st.since > 1500000) return 'worry';
  if (typingOn && st.mode !== 'pomo') return 'focus';          // typing: locked in, serious; back to normal when it stops
  if (music.on) return musicMood(now);                 // nothing else going on: vibe to the music
  const i = idleNow() / 1000;
  return i > 180 || energy<8 ? 'asleep' : i > 65 || energy<25 ? 'sleepy' : i > 18 || energy<55 ? 'bored' : 'alert';
}
// ---- idle acts: small things it does when nothing else is going on ----
const ACTS = [['bee',.08],['double',.14],['squint',.10],['side',.12],['fly',.08],['clock',.12],['daydream',.10],['cross',.07],['wink',.10],['sneeze',.03],['thought',.10],['yawn',.04]];

// a bee flies a lazy looping path across the screen; the eyes follow it, cross-eyed when it buzzes past the face
const BEE = { on:false, t0:0, dur:0, sx:0, ex:0, sy:0, ph:0, x:0, y:0, fading:0 };
function beeStart(now) {
  const W = innerWidth, r = $('#face').getBoundingClientRect(), fromLeft = Math.random() < .5;
  Object.assign(BEE, { on:true, t0:now, dur:8500 + Math.random()*2500, sx: fromLeft ? -.08*W : 1.08*W, ex: fromLeft ? 1.08*W : -.08*W,
                       sy: r.top + r.height*(.28 + Math.random()*.3), ph: Math.random()*6.28, fading:0 });

function beePos(u) {

  const loop = Math.sin(Math.PI*u) * .06 * W, a = u * 20 + BEE.ph;                // looping flight
  return { x: BEE.sx + (BEE.ex - BEE.sx) * e + Math.cos(a) * loop,
           y: BEE.sy + Math.sin(u*7 + BEE.ph) * .12*H + Math.sin(a) * loop * .8 };
}
// returns {x,y} of the bee (screen px) while it is flying, else null; hides it when done or when something real happens
function beeStep(now, calm) {

  const el = $('#bee'), u = (now - BEE.t0) / BEE.dur;
  if (!calm && !BEE.fading) BEE.fading = now;                                     // real reaction: bee leaves
  const f = BEE.fading ? 1 - (now - BEE.fading) / 350 : 1;

  const p = beePos(u), dir = p.x >= BEE.x ? 1 : -1;

function pickAct(lv) {

  let r = Math.random() * pool.reduce((s, a) => s + a[1], 0);

function frame(now) {
  const lv = level(now), i = idleNow() / 1000;
  const dt=1/60; if(i>2){energy=clamp(energy-.025,0,100);attention=clamp(attention-.035,0,100);} else {energy=clamp(energy+.12,0,100);attention=clamp(attention+.08,0,100);}

  // idle acts only run while it is calm (idle / bored / vibing); any real reaction wins
  const calm = lv==='alert' || lv==='bored' || lv==='vibe' || lv==='chill';
  let winkAmt = 0, cross = 0, mouthOverride = null;
  if (now > micro.next) {
    if (calm && now >= notifyUntil && !BEE.on) {
      micro.type = pickAct(lv); micro.start = now; micro.until = now + ACT_MS[micro.type]; micro.d2 = micro.said = false;

      if (micro.type === 'bee') beeStart(now);
      if (micro.type === 'yawn') flash = { mood:'yawn', until: now + 1800 };
      if (micro.type === 'thought') { say = { text: THOUGHTS[Math.floor(Math.random()*THOUGHTS.length)], until: Date.now() + 3200 }; render(); }

    switch (micro.type) {
      case 'squint': lidT = Math.max(lidT,.55); break;
      case 'side': gaze = {x:.85,y:0}; break;
      case 'fly': gaze = {x:Math.sin(now/90)*.85,y:Math.cos(now/130)*.5}; break;
      case 'double': if (u > .45 && !micro.d2) { blinkStart = now; micro.d2 = true; } break;
      case 'clock': gaze = {x:0,y:.95}; break;                                            // glance down at the time
      case 'daydream': gaze = {x:-.55+Math.sin(now/700)*.2,y:-.7}; mouthOverride='M228 268 Q250 280 272 268'; break;
      case 'cross': gaze = {x:0,y:.1}; cross = Math.sin(u*Math.PI); break;                // cross-eyed at its own nose
      case 'wink': winkAmt = Math.sin(u*Math.PI) > .3 ? 1 : 0; mouthOverride='M222 272 Q256 288 290 258'; break;

        else { lidT = 1; shake = 5; mouthOverride='M230 250 Q250 296 270 250';              // "ACHOO"
               if (!micro.said) { micro.said = true; say = { text:'achoo', until: Date.now()+1500 }; render(); } }

  $('#face').classList.toggle('sway', music.on && !pk);
  $('#face').classList.toggle('audio-live', music.on && audioFresh);
  $('#face').style.animationDuration = `${(3.2-bassPulse*1.1).toFixed(2)}s`;
  const MOUTH={win:'M222 272 Q256 288 290 258',happy:'M215 268 Q250 292 285 268',overjoyed:'M210 262 Q250 298 290 262',vibe:'M228 268 Q250 280 272 268',strain:'M222 278 Q236 268 250 278 T278 278',judge:'M228 278 L272 278',hype:'M212 264 Q250 296 288 264',chill:'M232 270 Q250 275 268 270',yawn:'M230 250 Q250 296 270 250',worry:'M222 278 Q236 268 250 278 T278 278',angry:'M222 284 Q250 264 278 284',annoyed:'M228 278 Q250 270 272 278',panic:'M236 262 Q250 294 264 262 Q250 254 236 262Z',flinch:'M226 280 Q238 270 250 280 T274 280'};
  const mouth=$('#mouth'), md=mouthOverride||MOUTH[lv]; mouth.style.opacity=md?1:0; if(md) mouth.setAttribute('d',md);

            worry:[-1,8,-1],flinch:[-.6,2,-.7],panic:[-.6,22,-.8],yawn:[0,2,0],bored:[0,-6,0],sleepy:[-.15,-12,0],asleep:[0,-14,0]};
  const e = EX[lv] || [0,0,0];
