<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Audio | Gemini Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b10;
            --bg-surface: rgba(18, 20, 29, 0.7);
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --accent-secondary: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-active: rgba(99, 102, 241, 0.4);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-full: 9999px;
            --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Backgrounds */
        .ambient-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 10s ease-in-out infinite alternate;
        }
        .glow-1 { top: -100px; left: -100px; background: var(--accent-primary); }
        .glow-2 { bottom: -100px; right: -100px; background: var(--accent-secondary); }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.2) translate(40px, -30px); opacity: 0.35; }
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1050px;
            height: 85vh;
            max-height: 800px;
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), var(--shadow-glow);
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .server-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border-active);
            color: #818cf8;
            border-radius: var(--radius-full);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        /* Layout Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 850px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .lyrics-pane {
                display: none !important;
            }
        }

        /* Playlist Section */
        .playlist-pane {
            display: flex;
            flex-direction: column;
            padding: 20px 28px;
            border-right: 1px solid var(--border-light);
            overflow: hidden;
        }

        .search-bar {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 10px 14px 10px 38px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
            pointer-events: none;
        }

        .song-list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .song-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .song-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .song-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            margin-bottom: 6px;
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .song-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-light);
        }

        .song-card.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--border-active);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .song-index {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            width: 20px;
            text-align: center;
        }

        .song-card.active .song-index {
            color: var(--accent-primary);
        }

        .song-details {
            min-width: 0;
            flex: 1;
        }

        .song-title-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-card.active .song-title-text {
            color: #a5b4fc;
        }

        .song-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Lyrics / Visualizer Pane */
        .lyrics-pane {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        .pane-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .visualizer-box {
            height: 80px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid var(--border-light);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .lyrics-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            padding: 16px;
            overflow-y: auto;
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--text-muted);
            white-space: pre-wrap;
            font-family: inherit;
        }

        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .no-lyrics {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            font-style: italic;
            font-size: 0.85rem;
        }

        /* Player Control Bar (Footer) */
        .player-bar {
            padding: 16px 28px;
            background: rgba(10, 11, 16, 0.85);
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scrubber-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-stamp {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            width: 40px;
        }
        .time-stamp.right { text-align: right; }

        .progress-bar-container {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .now-playing-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 220px;
        }

        .track-cover {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-light);
        }

        .track-cover svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
        }

        .track-info {
            min-width: 0;
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-status {
            font-size: 0.725rem;
            color: var(--text-dim);
        }

        .center-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-ctrl {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover {
            color: var(--text-main);
            transform: scale(1.05);
        }

        .btn-ctrl.main-play {
            width: 44px;
            height: 44px;
            background: var(--text-main);
            color: var(--bg-base);
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
        }

        .btn-ctrl.main-play:hover {
            transform: scale(1.08);
            background: #ffffff;
            color: var(--bg-base);
        }

        .btn-ctrl svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .side-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            width: 220px;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 110px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
        }

        /* Loading Skeleton */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            gap: 12px;
            color: var(--text-dim);
            font-size: 0.875rem;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="ambient-bg glow-1"></div>
    <div class="ambient-bg glow-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="brand-title">Aether Player</div>
            </div>
            <div class="server-badge" id="songCountBadge">Scanning Library...</div>
        </header>

        <!-- Main Body -->
        <div class="content-grid">
            <!-- Left Pane: Songs -->
            <section class="playlist-pane">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search tracks..." autocomplete="off">
                </div>

                <div class="song-list-container" id="songList">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <span>Reading C++ Audio Stream...</span>
                    </div>
                </div>
            </section>

            <!-- Right Pane: Lyrics & Visualizer -->
            <section class="lyrics-pane">
                <div class="pane-title">Realtime Frequency</div>
                <div class="visualizer-box">
                    <canvas id="visualizerCanvas"></canvas>
                </div>

                <div class="pane-title">Synchronized Lyrics</div>
                <div class="lyrics-container" id="lyricsBox">
                    <div class="no-lyrics">Select a track to view lyrics</div>
                </div>
            </section>
        </div>

        <!-- Player Control Bar -->
        <footer class="player-bar">
            <!-- Timeline Scrubber -->
            <div class="scrubber-group">
                <span class="time-stamp" id="currentTime">0:00</span>
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="time-stamp right" id="durationTime">0:00</span>
            </div>

            <!-- Controls Row -->
            <div class="controls-row">
                <!-- Track Details -->
                <div class="now-playing-meta">
                    <div class="track-cover">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
                    </div>
                    <div class="track-info">
                        <div class="track-title" id="playerTrackTitle">No Track Selected</div>
                        <div class="track-status" id="playerStatus">Ready</div>
                    </div>
                </div>

                <!-- Center Controls -->
                <div class="center-controls">
                    <button class="btn-ctrl" id="prevBtn" title="Previous">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="btn-ctrl main-play" id="playBtn" title="Play/Pause">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="btn-ctrl" id="nextBtn" title="Next">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>

                <!-- Side Controls -->
                <div class="side-controls">
                    <div class="volume-box">
                        <button class="btn-ctrl" id="muteBtn" style="padding:0;">
                            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        </button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Hidden Native Audio Engine -->
    <audio id="audioEngine" preload="metadata"></audio>

    <script>
        // DOM Elements
        const audioEngine = document.getElementById('audioEngine');
        const songListEl = document.getElementById('songList');
        const searchInput = document.getElementById('searchInput');
        const songCountBadge = document.getElementById('songCountBadge');
        const lyricsBox = document.getElementById('lyricsBox');
        
        // Player UI Controls
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const playerTrackTitle = document.getElementById('playerTrackTitle');
        const playerStatus = document.getElementById('playerStatus');
        const volumeSlider = document.getElementById('volumeSlider');

        // Visualizer Canvas
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');

        // State Management
        let songs = [];
        let filteredSongs = [];
        let currentSongIndex = -1;
        let isPlaying = false;
        let audioCtx, analyser, sourceNode;

        // Web Audio API Visualizer Setup
        function initAudioContext() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            
            sourceNode = audioCtx.createMediaElementSource(audioEngine);
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);

            renderVisualizer();
        }

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);
            const bufferLength = analyser ? analyser.frequencyBinCount : 0;
            const dataArray = new Uint8Array(bufferLength);

            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
            }

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 1.5;
            let barX = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                
                const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#6366f1');
                gradient.addColorStop(1, '#a855f7');

                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(barX, canvas.height - barHeight, barWidth - 2, barHeight);

                barX += barWidth;
            }
        }

        // Fetch Songs from C++ Backend (Root relative routing)
        async function fetchLibrary() {
            try {
                const response = await fetch('/api/songs');
                if (!response.ok) throw new Error('C++ Server returned invalid status');
                
                const data = await response.json();
                songs = data.songs || [];
                filteredSongs = [...songs];
                
                songCountBadge.textContent = `${songs.length} Tracks Loaded`;
                renderPlaylist(filteredSongs);
            } catch (err) {
                console.error('Library Sync Error:', err);
                songCountBadge.textContent = 'Server Offline';
                songListEl.innerHTML = `<div class="no-lyrics">Failed to load songs from C++ backend</div>`;
            }
        }

        // Render Playlist Items
        function renderPlaylist(items) {
            if (items.length === 0) {
                songListEl.innerHTML = `<div class="no-lyrics">No tracks found</div>`;
                return;
            }

            songListEl.innerHTML = items.map((song, idx) => `
                <div class="song-card ${currentSongIndex === song.id ? 'active' : ''}" onclick="playSongById(${song.id})">
                    <div class="song-info">
                        <span class="song-index">${song.id + 1}</span>
                        <div class="song-details">
                            <div class="song-title-text">${escapeHtml(song.name)}</div>
                            <div class="song-sub">MP3 Audio</div>
                        </div>
                    </div>
                    <div class="song-actions">
                        <button class="action-btn" title="Download" onclick="event.stopPropagation(); downloadSong(${song.id})">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Play Specific Song
        function playSongById(id) {
            initAudioContext();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const targetSong = songs.find(s => s.id === id);
            if (!targetSong) return;

            currentSongIndex = id;
            audioEngine.src = `/api/play/${id}`;
            audioEngine.play();
            
            isPlaying = true;
            updatePlayButtonUI(true);
            playerTrackTitle.textContent = targetSong.name;
            playerStatus.textContent = 'Streaming from POSIX Server...';

            fetchLyrics(id);
            renderPlaylist(filteredSongs);
        }

        // Fetch Lyrics
        async function fetchLyrics(id) {
            lyricsBox.innerHTML = `<div class="no-lyrics">Loading lyrics...</div>`;
            try {
                const res = await fetch(`/lyrics/${id}`);
                if (!res.ok) throw new Error('No lyrics available');
                const text = await res.text();
                lyricsBox.textContent = text || 'Instrumental or no text available.';
            } catch (err) {
                lyricsBox.innerHTML = `<div class="no-lyrics">No lyrics found for this track</div>`;
            }
        }

        // Download Song
        function downloadSong(id) {
            window.location.href = `/download/${id}`;
        }

        // Toggle Play/Pause
        function togglePlay() {
            if (currentSongIndex === -1 && songs.length > 0) {
                playSongById(songs[0].id);
                return;
            }
            if (isPlaying) {
                audioEngine.pause();
                isPlaying = false;
                playerStatus.textContent = 'Paused';
            } else {
                audioEngine.play();
                isPlaying = true;
                playerStatus.textContent = 'Streaming from POSIX Server...';
            }
            updatePlayButtonUI(isPlaying);
        }

        function updatePlayButtonUI(playing) {
            if (playing) {
                playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
            } else {
                playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
            }
        }

        // Previous / Next Track Controls
        function playNext() {
            if (songs.length === 0) return;
            let nextIndex = (currentSongIndex + 1) % songs.length;
            playSongById(nextIndex);
        }

        function playPrev() {
            if (songs.length === 0) return;
            let prevIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSongById(prevIndex);
        }

        // Format Seconds to MM:SS
        function formatTime(secs) {
            if (isNaN(secs)) return '0:00';
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Helper Utility
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Event Listeners
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', playNext);
        prevBtn.addEventListener('click', playPrev);

        audioEngine.addEventListener('timeupdate', () => {
            const current = audioEngine.currentTime;
            const duration = audioEngine.duration;
            if (!isNaN(duration) && duration > 0) {
                const pct = (current / duration) * 100;
                progressFill.style.width = `${pct}%`;
                currentTimeEl.textContent = formatTime(current);
                durationTimeEl.textContent = formatTime(duration);
            }
        });

        audioEngine.addEventListener('ended', playNext);

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickPos = (e.clientX - rect.left) / rect.width;
            if (!isNaN(audioEngine.duration)) {
                audioEngine.currentTime = clickPos * audioEngine.duration;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audioEngine.volume = e.target.value;
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filteredSongs = songs.filter(s => s.name.toLowerCase().includes(query));
            renderPlaylist(filteredSongs);
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                playNext();
            } else if (e.code === 'ArrowLeft') {
                playPrev();
            }
        });

        // Initial Boot
        fetchLibrary();
    </script>
</body>
</html>
